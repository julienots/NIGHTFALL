<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>NIGHTFALL: Rise of the Abyss — SuperEssence</title>
  <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Lilita+One&family=Nunito:wght@600;800;900&display=swap" />
  <link rel="stylesheet" href="/src/style.css" />
</head>
<body>
  <div id="boot" class="screen">
    <button id="start" class="start">Cliquez ou appuyez pour commencer</button>
  </div>
  <canvas id="intro" class="screen hidden"></canvas>
  <div id="title" class="screen hidden">
    <canvas id="title-bg"></canvas>
    <div class="title-logo">
      <h1 data-text="NIGHTFALL">NIGHTFALL</h1>
      <h2><span>RISE OF THE ABYSS</span></h2>
    </div>
    <p class="press">Appuyez sur une touche</p>
    <div class="title-menu hidden">
      <button class="tbtn" id="btn-continue"><i class="ti">▶</i><span class="tl">Continuer<small id="save-info"></small></span></button>
      <button class="tbtn" id="btn-new"><i class="ti">✦</i><span class="tl">Nouvelle partie<small>Le prologue de Noa</small></span></button>
      <button class="tbtn alt" id="btn-chapters"><i class="ti">☰</i><span class="tl">Chapitres<small>Rejouer un moment clé</small></span></button>
      <div class="chapters hidden" id="chapters">
        <button class="tbtn small" data-ch="prologue"><b>00</b>Prologue — Après les cours</button>
        <button class="tbtn small" data-ch="ch1"><b>01</b>Chapitre 1 — Vesper Downtown</button>
        <button class="tbtn small" data-ch="ch2"><b>02</b>Chapitre 2 — Double vie</button>
      </div>
    </div>
    <p class="studio">© SuperEssence · v1.4 « Refonte »</p>
  </div>
  <div id="loading" class="screen hidden"><p class="loading">Chargement de Vesper…</p></div>
  <div id="game" class="hidden"></div>
  <p id="skip" class="skip hidden">Appuyez pour passer</p>
  <script type="module" src="/src/main.js"></script>
</body>
</html>
