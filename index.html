<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>NIGHTFALL: Rise of the Abyss — SuperEssence</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Lilita+One&family=Nunito:wght@600;800;900&display=swap" />
  <link rel="stylesheet" href="/src/style.css" />
</head>
<body>
  <div id="boot" class="screen">
    <button id="start" class="start">Cliquez ou appuyez pour commencer</button>
  </div>
  <canvas id="intro" class="screen hidden"></canvas>
  <div id="title" class="screen hidden">
    <h1>NIGHTFALL</h1>
    <h2>RISE OF THE ABYSS</h2>
    <p class="press">Appuyez sur une touche</p>
    <div class="title-menu hidden">
      <button class="tbtn" id="btn-continue">Continuer</button>
      <button class="tbtn" id="btn-new">Nouvelle partie</button>
      <p class="save-info" id="save-info"></p>
    </div>
    <p class="studio">© SuperEssence</p>
  </div>
  <div id="loading" class="screen hidden"><p class="loading">Chargement de Vesper…</p></div>
  <div id="game" class="hidden"></div>
  <p id="skip" class="skip hidden">Appuyez pour passer</p>
  <script type="module" src="/src/main.js"></script>
</body>
</html>
